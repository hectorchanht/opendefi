<script>const L={"k0": ["The Uniswap formula is OpenDeFi's Mandelbrot — x·y = k: one line a child can run, and an entire financial universe falls out of it (pools, prices, slippage, impermanent loss). A real interactive pool toy first, the formula as the seed, depth ladder after.", "Uniswap 公式係 OpenDeFi 嘅 Mandelbrot——x·y = k：小朋友都 run 到嘅一行，成個金融宇宙就由佢跌出嚟（pools、prices、slippage、impermanent loss）。先玩真正互動嘅 pool 玩具，公式係種子，之後係深度階梯。"], "k1": ["DawnSci (the number Oracle) does every number — APY, impermanent loss, liquidation prices: computed by the Oracle with provenance, never estimated by a language model. In DeFi, a hallucinated number is not an embarrassment; it is someone's savings.", "DawnSci（數字 Oracle）負責每一個數字——APY、impermanent loss、liquidation prices：由 Oracle 連出處計出嚟，永遠唔係語言模型估出嚟。喺 DeFi，一個幻覺數字唔係尷尬，係人哋嘅積蓄。"], "k2": ["The traps are curriculum, with the same prominence as the mechanics: impermanent loss, rug pulls, fake APY, leverage liquidation, bridge hacks. A DeFi school that only teaches the upside is a sales funnel, and Dawn does not build those.", "陷阱係課程，重要性同 mechanics 一樣：impermanent loss、rug pulls、假 APY、槓桿爆倉、bridge hacks。只教上行嘅 DeFi 學校係 sales funnel，Dawn 唔起呢啲嘢。"], "k3": ["Education, never advice; simulation before real money — paper pools and historical replays first. No custody, no yield promises, no Dawn token sold on promises.", "係教育，永遠唔係建議；真錢之前先模擬——paper pools 同歷史重播行先。唔託管、唔承諾收益、唔賣靠承諾嘅 Dawn token。"], "k4": ["Roadmap — founding brief in preparation", "路線圖 — 立派文件準備中"], "k5": ["Where the money goes — taught honestly.", "錢去咗邊——誠實咁教。"], "k6": ["Open crypto worth talking about by everyone at every age: they will know the Uniswap formula, they will know how to stake and make money. We are the best teachers in the world — and in DeFi, the traps are curriculum too.", "值得每個年齡嘅人都一齊講嘅開放 crypto：佢哋會識 Uniswap 公式，會識點樣 stake 同賺錢。我哋係世界上最好嘅老師——而喺 DeFi，陷阱都係課程嘅一部分。"], "k7": ["Founding — initialized, first release in preparation", "創建中 — 已初始化，第一版準備中"], "k8": ["What it is", "係乜嚟"], "k9": ["END GOAL", "最終目標"], "k10": ["Open crypto worth talking about by everyone at every age — everyone knows the Uniswap formula and how to stake, taught by the best teachers in the world, with the crash taught too: after every crash, the teachers who taught the crash too are the only ones still standing. Trust is the asset that compounds.", "值得每個年齡嘅人都一齊講嘅開放 crypto——人人都識 Uniswap 公式同點樣 stake，由世界上最好嘅老師教，連 crash 都教埋：每次 crash 之後，連 crash 都有教嘅老師先係企得住嘅。信任先係會複利嘅資產。"], "k11": ["ROADMAP", "路線圖"], "k12": ["STATUS", "狀態"], "k13": ["Founding — initialized, first release in preparation. No features are live yet; this page is the founding record.", "創建中 — 已初始化，第一版準備中。暫時未有任何功能上線；呢一頁係立派記錄。"]};function setLang(l){document.querySelectorAll('[data-i]').forEach(e=>{const v=L[e.dataset.i];if(v)e.textContent=l==='zh'?v[1]:v[0];});document.getElementById('b-en').setAttribute('aria-pressed',l==='en');document.getElementById('b-zh').setAttribute('aria-pressed',l==='zh');document.documentElement.lang=l==='zh'?'zh-Hant':'en';}document.getElementById('b-en').onclick=()=>setLang('en');document.getElementById('b-zh').onclick=()=>setLang('zh');setLang('en');</script></body></html>
